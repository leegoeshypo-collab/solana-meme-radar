
name: Solana Meme Coin Radar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out radar
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_LIQUIDITY_USD: "10000"
          MIN_MARKET_CAP_USD: "10000"
          MAX_MARKET_CAP_USD: "500000"
          MAX_AGE_HOURS: "24"
          MIN_24H_VOLUME_USD: "5000"
        run: python radar.py

      - name: Save seen-token list
        run: |
          git config user.name "meme-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen token list" && git push)
